name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  migration-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migration/schema tests
        env:
          TAXI_DB_HOST: 127.0.0.1
          TAXI_DB_PORT: 3306
          TAXI_DB_USER: root
          TAXI_DB_PASSWORD: root_password
        run: python -m pytest tests/ -v
